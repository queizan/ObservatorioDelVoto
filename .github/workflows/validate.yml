name: Comprobar datos y web
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar encuestas y regenerar JS
        run: python3 scripts/sync-data.py
      - name: Validar programas y regenerar JS
        run: python3 scripts/sync-programmes.py
      - name: Comprobar que los archivos generados están publicados
        run: git diff --exit-code -- data/polls.js data/programmes.js
      - name: Comprobar sintaxis JavaScript
        run: node --check app.js && node --check data/polls.js && node --check data/programmes.js && node --check program-documents.js
      - name: Comprobar separación de candidaturas y comparador de programas
        run: node scripts/test-candidacy.js && node scripts/test-programmes.js
